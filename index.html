<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EXO-GAUNTLET // TACTICAL HUD</title>
  <style>
    :root {
      --primary: #00e5ff;
      --primary-dim: rgba(0, 229, 255, 0.15);
      --alert: #ff1744;
      --alert-dim: rgba(255, 23, 68, 0.2);
      --bg: #03080f;
      --panel-bg: rgba(6, 17, 33, 0.75);
      --hud-font: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: var(--hud-font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.05) 0%, transparent 80%),
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
    }

    /* Effet scanline rétro-tactique */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 99;
    }

    .gauntlet-frame {
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--primary);
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 229, 255, 0.1);
      backdrop-filter: blur(8px);
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .gauntlet-frame.combat {
      border-color: var(--alert);
      box-shadow: 0 0 35px var(--alert-dim), inset 0 0 20px var(--alert-dim);
    }

    /* Coins tactiques */
    .corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--primary);
      pointer-events: none;
    }
    .c-tl { top: -2px; left: -2px; border-top: 3px solid; border-left: 3px solid; }
    .c-tr { top: -2px; right: -2px; border-top: 3px solid; border-right: 3px solid; }
    .c-bl { bottom: -2px; left: -2px; border-bottom: 3px solid; border-left: 3px solid; }
    .c-br { bottom: -2px; right: -2px; border-bottom: 3px solid; border-right: 3px solid; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--primary-dim);
      padding-bottom: 8px;
      margin-bottom: 14px;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
    }

    .status-pill {
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid currentColor;
      color: #777;
    }

    .status-pill.online {
      color: #00e676;
      border-color: #00e676;
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.3);
    }

    .status-pill.combat {
      color: var(--alert);
      border-color: var(--alert);
      box-shadow: 0 0 12px var(--alert-dim);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Radar Holo & CSI */
    .radar-container {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 15px auto;
      border-radius: 50%;
      border: 1px solid var(--primary-dim);
      background: radial-gradient(circle, rgba(0, 229, 255, 0.08) 0%, transparent 70%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .radar-circle {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed rgba(0, 229, 255, 0.3);
    }
    .r-mid { width: 110px; height: 110px; }
    .r-inner { width: 55px; height: 55px; }

    .radar-cross-h { position: absolute; width: 100%; height: 1px; background: var(--primary-dim); }
    .radar-cross-v { position: absolute; height: 100%; width: 1px; background: var(--primary-dim); }

    .radar-sweep {
      position: absolute;
      width: 100%;
      height: 100%;
      background: conic-gradient(from 0deg at 50% 50%, rgba(0, 229, 255, 0.4) 0deg, transparent 60deg);
      border-radius: 50%;
      animation: rotateSweep 2.5s linear infinite;
    }

    @keyframes rotateSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .radar-stats {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--primary-dim);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-around;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary);
    }

    .combat .stat-val {
      color: var(--alert);
    }

    /* Boutons de commande gantelet */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .hud-btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 14px 6px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .hud-btn:active {
      transform: scale(0.97);
      background: var(--primary);
      color: #000;
    }

    .hud-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      pointer-events: none;
    }

    .hud-btn.full-width {
      grid-column: span 2;
    }

    .btn-combat {
      border-color: var(--alert);
      color: var(--alert);
    }
    .btn-combat:active {
      background: var(--alert);
      color: #fff;
    }

    .btn-repos {
      border-color: #00e676;
      color: #00e676;
    }
    .btn-repos:active {
      background: #00e676;
      color: #000;
    }

    /* Terminal logs */
    .console-logs {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #14283b;
      border-radius: 6px;
      height: 90px;
      padding: 8px;
      font-size: 0.7rem;
      color: #6a8c9e;
      overflow-y: auto;
      text-align: left;
    }
    .console-line { margin-bottom: 3px; }
    .console-line.highlight { color: var(--primary); }
    .console-line.alert { color: var(--alert); }
  </style>
</head>
<body>

  <div class="gauntlet-frame" id="gauntletFrame">
    <div class="corner c-tl"></div>
    <div class="corner c-tr"></div>
    <div class="corner c-bl"></div>
    <div class="corner c-br"></div>

    <div class="header-bar">
      <span>ARM-SYS // MK-VII</span>
      <div class="status-pill" id="hudStatus">STANDBY</div>
    </div>

    <!-- Écran Radar Passif (CSI + BLE) -->
    <div class="radar-container">
      <div class="radar-sweep"></div>
      <div class="radar-circle r-mid"></div>
      <div class="radar-circle r-inner"></div>
      <div class="radar-cross-h"></div>
      <div class="radar-cross-v"></div>
    </div>

    <!-- Métriques Fusion Radar -->
    <div class="radar-stats">
      <div>
        <div>CLOISON CSI</div>
        <div class="stat-val" id="csiVal">0</div>
      </div>
      <div>
        <div>SCAN BLE</div>
        <div class="stat-val" id="bleVal">0</div>
      </div>
      <div>
        <div>CIBLES TOTAL</div>
        <div class="stat-val" id="totalVal">0</div>
      </div>
    </div>

    <!-- Contrôles Tactiles -->
    <div class="action-grid">
      <button class="hud-btn full-width" id="connectBtn">Lier Gantelet (BLE)</button>
      <button class="hud-btn btn-combat" id="combatBtn" disabled>Mode Combat [180°]</button>
      <button class="hud-btn btn-repos" id="reposBtn" disabled>Repos [0°]</button>
    </div>

    <!-- Console Système -->
    <div class="console-logs" id="consoleBox">
      <div class="console-line">> Système initialisé. En attente de télémétrie...</div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxChar = null;
    let txChar = null;

    const frame = document.getElementById("gauntletFrame");
    const hudStatus = document.getElementById("hudStatus");
    const connectBtn = document.getElementById("connectBtn");
    const combatBtn = document.getElementById("combatBtn");
    const reposBtn = document.getElementById("reposBtn");
    const consoleBox = document.getElementById("consoleBox");

    const csiVal = document.getElementById("csiVal");
    const bleVal = document.getElementById("bleVal");
    const totalVal = document.getElementById("totalVal");

    function log(text, cls = "") {
      const line = document.createElement("div");
      line.className = `console-line ${cls}`;
      line.textContent = `> ${text}`;
      consoleBox.appendChild(line);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function parler(texte) {
      if ('speechSynthesis' in window) {
        const synth = new SpeechSynthesisUtterance(texte);
        synth.lang = 'fr-FR';
        synth.rate = 1.05;
        window.speechSynthesis.speak(synth);
      }
    }

    // Connexion Bluetooth Low Energy
    async function initBLE() {
      try {
        log("Scan radio : recherche ESP32...", "highlight");
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "Jarvis_ESP32" }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnect);

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxChar = await service.getCharacteristic(CHAR_RX_UUID);
        txChar = await service.getCharacteristic(CHAR_TX_UUID);

        // Écoute des données Radar envoyées par l'ESP32
        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', handleTelemetry);

        hudStatus.className = "status-pill online";
        hudStatus.textContent = "CONNECTED";
        connectBtn.style.display = "none";
        combatBtn.disabled = false;
        reposBtn.disabled = false;

        log("Liaison téléversement établie.", "highlight");
        parler("Gantelet opérationnel monsieur.");
      } catch (err) {
        log("Échec : " + err.message, "alert");
      }
    }

    function onDisconnect() {
      hudStatus.className = "status-pill";
      hudStatus.textContent = "OFFLINE";
      frame.classList.remove("combat");
      connectBtn.style.display = "block";
      combatBtn.disabled = true;
      reposBtn.disabled = true;
      log("Déconnexion du microcontrôleur.", "alert");
    }

    // Réception du paquet Radar CSI + BLE (ex: RADAR:3:BLE=2:CSI=1)
    function handleTelemetry(event) {
      const decoder = new TextDecoder('utf-8');
      const msg = decoder.decode(event.target.value);

      if (msg.startsWith("RADAR:")) {
        const parts = msg.split(":");
        const total = parts[1];
        const ble = parts[2].split("=")[1];
        const csi = parts[3].split("=")[1];

        totalVal.textContent = total;
        bleVal.textContent = ble;
        csiVal.textContent = csi;

        if (parseInt(total) > 0) {
          log(`Cible(s) détectée(s) : ${total} (Ondes:${csi} | Radio:${ble})`, "highlight");
        }
      }
    }

    // Envoi des ordres moteur à l'ESP32
    async function sendCommand(cmd) {
      if (!rxChar) return;
      try {
        const encoder = new TextEncoder();
        await rxChar.writeValue(encoder.encode(cmd));
        log(`Exécution ordre : ${cmd}`, "highlight");
      } catch (err) {
        log("Erreur transmission : " + err.message, "alert");
      }
    }

    // Activation Mode Combat
    combatBtn.addEventListener("click", () => {
      frame.classList.add("combat");
      hudStatus.className = "status-pill combat";
      hudStatus.textContent = "COMBAT MODE";
      parler("Mode combat actif.");
      sendCommand("COMBAT");
    });

    // Retour Repos
    reposBtn.addEventListener("click", () => {
      frame.classList.remove("combat");
      hudStatus.className = "status-pill online";
      hudStatus.textContent = "CONNECTED";
      parler("Retour au mode repos.");
      sendCommand("REPOS");
    });

    connectBtn.addEventListener("click", initBLE);
  </script>
</body>
</html>
