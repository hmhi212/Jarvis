<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EXO-GAUNTLET // TACTICAL HUD</title>
  <style>
    :root {
      --primary: #00e5ff;
      --primary-dim: rgba(0, 229, 255, 0.15);
      --alert: #ff1744;
      --alert-dim: rgba(255, 23, 68, 0.2);
      --success: #00e676;
      --bg: #03080f;
      --panel-bg: rgba(6, 17, 33, 0.85);
      --hud-font: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: var(--hud-font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.05) 0%, transparent 80%),
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 99;
    }

    .gauntlet-frame {
      width: 100%;
      max-width: 440px;
      border: 1px solid var(--primary);
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 229, 255, 0.1);
      backdrop-filter: blur(8px);
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .gauntlet-frame.combat {
      border-color: var(--alert);
      box-shadow: 0 0 35px var(--alert-dim), inset 0 0 20px var(--alert-dim);
    }

    .corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--primary);
      pointer-events: none;
    }
    .c-tl { top: -2px; left: -2px; border-top: 3px solid; border-left: 3px solid; }
    .c-tr { top: -2px; right: -2px; border-top: 3px solid; border-right: 3px solid; }
    .c-bl { bottom: -2px; left: -2px; border-bottom: 3px solid; border-left: 3px solid; }
    .c-br { bottom: -2px; right: -2px; border-bottom: 3px solid; border-right: 3px solid; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--primary-dim);
      padding-bottom: 8px;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
    }

    .status-pill {
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid currentColor;
      color: #777;
    }

    .status-pill.online {
      color: var(--success);
      border-color: var(--success);
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.3);
    }

    .status-pill.combat {
      color: var(--alert);
      border-color: var(--alert);
      box-shadow: 0 0 12px var(--alert-dim);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Radar Polaire Stabilisé */
    .radar-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 12px auto;
    }

    #radarCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.08) 0%, rgba(3, 8, 15, 0.9) 75%);
      border: 1px solid var(--primary-dim);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
      display: block;
    }

    /* Métriques Fusion */
    .radar-stats {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--primary-dim);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-around;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary);
      margin-top: 2px;
    }

    .combat .stat-val {
      color: var(--alert);
    }

    /* Boutons Tactiles */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .hud-btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 12px 6px;
      border-radius: 6px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .hud-btn:active {
      transform: scale(0.97);
      background: var(--primary);
      color: #000;
    }

    .hud-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      pointer-events: none;
    }

    .hud-btn.full-width {
      grid-column: span 2;
    }

    .btn-combat {
      border-color: var(--alert);
      color: var(--alert);
    }
    .btn-combat:active {
      background: var(--alert);
      color: #fff;
    }

    .btn-repos {
      border-color: var(--success);
      color: var(--success);
    }
    .btn-repos:active {
      background: var(--success);
      color: #000;
    }

    .btn-voice {
      border-color: #ffd600;
      color: #ffd600;
    }
    .btn-voice.active {
      background: rgba(255, 214, 0, 0.2);
      box-shadow: 0 0 10px rgba(255, 214, 0, 0.4);
    }

    /* Console de retour */
    .console-logs {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #14283b;
      border-radius: 6px;
      height: 95px;
      padding: 8px;
      font-size: 0.7rem;
      color: #6a8c9e;
      overflow-y: auto;
      text-align: left;
    }
    .console-line { margin-bottom: 3px; word-break: break-word; }
    .console-line.highlight { color: var(--primary); }
    .console-line.alert { color: var(--alert); }
    .console-line.voice { color: #ffd600; }
  </style>
</head>
<body>

  <div class="gauntlet-frame" id="gauntletFrame">
    <div class="corner c-tl"></div>
    <div class="corner c-tr"></div>
    <div class="corner c-bl"></div>
    <div class="corner c-br"></div>

    <div class="header-bar">
      <span>ARM-SYS // MK-VII</span>
      <div class="status-pill" id="hudStatus">STANDBY</div>
    </div>

    <!-- Radar Canvas -->
    <div class="radar-wrapper">
      <canvas id="radarCanvas" width="220" height="220"></canvas>
    </div>

    <!-- Métriques Fusion Radar -->
    <div class="radar-stats">
      <div>
        <div>CLOISON CSI</div>
        <div class="stat-val" id="csiVal">0</div>
      </div>
      <div>
        <div>SCAN BLE</div>
        <div class="stat-val" id="bleVal">0</div>
      </div>
      <div>
        <div>CIBLES TOTAL</div>
        <div class="stat-val" id="totalVal">0</div>
      </div>
    </div>

    <!-- Contrôles -->
    <div class="action-grid">
      <button class="hud-btn full-width" id="connectBtn">Lier Gantelet (BLE)</button>
      <button class="hud-btn full-width btn-voice" id="voiceToggleBtn">Jarvis Voice : OFF</button>
      <button class="hud-btn btn-combat" id="combatBtn" disabled>Mode Combat [180°]</button>
      <button class="hud-btn btn-repos" id="reposBtn" disabled>Repos [0°]</button>
    </div>

    <!-- Console Système -->
    <div class="console-logs" id="consoleBox">
      <div class="console-line">> Système initialisé. En attente de connexion...</div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const CHAR_TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null;
    let rxChar = null;
    let txChar = null;

    const frame = document.getElementById("gauntletFrame");
    const hudStatus = document.getElementById("hudStatus");
    const connectBtn = document.getElementById("connectBtn");
    const combatBtn = document.getElementById("combatBtn");
    const reposBtn = document.getElementById("reposBtn");
    const voiceToggleBtn = document.getElementById("voiceToggleBtn");
    const consoleBox = document.getElementById("consoleBox");

    const csiVal = document.getElementById("csiVal");
    const bleVal = document.getElementById("bleVal");
    const totalVal = document.getElementById("totalVal");
    const canvas = document.getElementById("radarCanvas");
    const ctx = canvas.getContext("2d");

    function log(text, cls = "") {
      const line = document.createElement("div");
      line.className = `console-line ${cls}`;
      line.textContent = `> ${text}`;
      consoleBox.appendChild(line);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function parler(texte) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const synth = new SpeechSynthesisUtterance(texte);
        synth.lang = 'fr-FR';
        synth.rate = 1.05;
        window.speechSynthesis.speak(synth);
      }
    }

    // Gestion de l'audio HUD
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 880, duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // --- RECONNAISSANCE VOCALE PROPRE POUR PC & MOBILE ---
    let recognition = null;
    let voiceActive = false;
    let restartTimer = null;

    function initVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        log("Erreur : SpeechRecognition non disponible (utilise Chrome ou Edge).", "alert");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'fr-FR';
      recognition.continuous = false; // Plus stable sur ordinateur
      recognition.interimResults = false;

      recognition.onstart = () => {
        log("Écoute micro active...", "voice");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim().toLowerCase();
        log(`Entendu : "${transcript}"`, "voice");

        if (transcript.includes("combat") || transcript.includes("active")) {
          combatBtn.click();
        } else if (transcript.includes("repos") || transcript.includes("stop") || transcript.includes("éteins")) {
          reposBtn.click();
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'no-speech') return; // Silence normal
        log(`Erreur micro : ${e.error}`, "alert");
        if (e.error === 'not-allowed') {
          log("Microphone bloqué dans le navigateur.", "alert");
          stopVoice();
        }
      };

      recognition.onend = () => {
        if (voiceActive) {
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => {
            try { recognition.start(); } catch (err) {}
          }, 250);
        }
      };
    }

    function startVoice() {
      if (!recognition) initVoice();
      if (!recognition) return;

      voiceActive = true;
      voiceToggleBtn.classList.add("active");
      voiceToggleBtn.textContent = "JARVIS VOICE : ON";
      log("Commande vocale Jarvis armée.", "highlight");
      parler("Système vocal armé monsieur.");
      playBeep(1200, 0.15);

      try {
        recognition.start();
      } catch (e) {}
    }

    function stopVoice() {
      voiceActive = false;
      clearTimeout(restartTimer);
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
      voiceToggleBtn.classList.remove("active");
      voiceToggleBtn.textContent = "JARVIS VOICE : OFF";
      log("Commande vocale coupée.");
    }

    voiceToggleBtn.addEventListener("click", () => {
      if (!voiceActive) startVoice();
      else stopVoice();
    });

    // --- MOTEUR RADAR POLAIRE STABILISÉ (ANTI-SAUTS) ---
    let sweepAngle = 0;
    let targets = []; // Liste de cibles persistantes
    let smoothTotal = 0;

    function updateTargets(detectedTotal) {
      // Lissage du compteur total (évite le 0 puis 3 d'une seconde à l'autre)
      smoothTotal = Math.round((smoothTotal * 0.7) + (detectedTotal * 0.3));

      // Synchronisation du nombre d'échos sur le radar
      while (targets.length < smoothTotal) {
        targets.push({
          angle: Math.random() * Math.PI * 2,
          dist: 30 + Math.random() * 65,
          alpha: 1.0,
          id: Math.floor(Math.random() * 900 + 100)
        });
        playBeep(950, 0.05);
      }
      while (targets.length > smoothTotal) {
        targets.pop();
      }
    }

    function drawRadar() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const radius = 100;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Cercles concentriques
      ctx.strokeStyle = frame.classList.contains("combat") ? "rgba(255, 23, 68, 0.25)" : "rgba(0, 229, 255, 0.25)";
      ctx.lineWidth = 1;
      [35, 70, 100].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      });

      // Lignes axiales
      ctx.beginPath();
      ctx.moveTo(cx, cy - radius); ctx.lineTo(cx, cy + radius);
      ctx.moveTo(cx - radius, cy); ctx.lineTo(cx + radius, cy);
      ctx.stroke();

      // Faisceau rotatif
      sweepAngle += 0.035;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(sweepAngle);
      const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, radius);
      grad.addColorStop(0, frame.classList.contains("combat") ? "rgba(255, 23, 68, 0.4)" : "rgba(0, 229, 255, 0.4)");
      grad.addColorStop(1, "transparent");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, 0, Math.PI / 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Dessin des cibles lissées
      targets.forEach(t => {
        const tx = cx + Math.cos(t.angle) * t.dist;
        const ty = cy + Math.sin(t.angle) * t.dist;

        ctx.fillStyle = frame.classList.contains("combat") ? "rgba(255, 23, 68, 0.9)" : "rgba(0, 229, 255, 0.9)";
        ctx.beginPath();
        ctx.arc(tx, ty, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = ctx.fillStyle;
        ctx.beginPath();
        ctx.arc(tx, ty, 7, 0, Math.PI * 2);
        ctx.stroke();

        ctx.font = "8px monospace";
        ctx.fillText(`T-${t.id}`, tx + 6, ty - 4);
      });

      requestAnimationFrame(drawRadar);
    }
    drawRadar();

    // --- COMMUNICATION WEB BLUETOOTH (ESP32) ---
    async function initBLE() {
      try {
        log("Recherche ESP32 (Jarvis_ESP32)...", "highlight");
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "Jarvis_ESP32" }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnect);

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxChar = await service.getCharacteristic(CHAR_RX_UUID);
        txChar = await service.getCharacteristic(CHAR_TX_UUID);

        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', (e) => {
          const dec = new TextDecoder('utf-8');
          const msg = dec.decode(e.target.value);

          if (msg.startsWith("RADAR:")) {
            const parts = msg.split(":");
            const total = parseInt(parts[1], 10);
            const ble = parts[2].split("=")[1];
            const csi = parts[3].split("=")[1];

            totalVal.textContent = total;
            bleVal.textContent = ble;
            csiVal.textContent = csi;

            updateTargets(total);
          }
        });

        hudStatus.className = "status-pill online";
        hudStatus.textContent = "CONNECTED";
        connectBtn.style.display = "none";
        combatBtn.disabled = false;
        reposBtn.disabled = false;

        log("Liaison BLE opérationnelle.", "highlight");
        parler("Connexion établie monsieur.");
        playBeep(880, 0.1);
      } catch (err) {
        log("Erreur BLE : " + err.message, "alert");
      }
    }

    function onDisconnect() {
      hudStatus.className = "status-pill";
      hudStatus.textContent = "OFFLINE";
      frame.classList.remove("combat");
      connectBtn.style.display = "block";
      combatBtn.disabled = true;
      reposBtn.disabled = true;
      log("ESP32 déconnecté.", "alert");
    }

    async function sendCommand(cmd) {
      if (!rxChar) return;
      try {
        const enc = new TextEncoder();
        await rxChar.writeValue(enc.encode(cmd));
        log(`Consigne transmise : ${cmd}`, "highlight");
      } catch (err) {
        log("Échec envoi BLE : " + err.message, "alert");
      }
    }

    // Commandes d'action
    combatBtn.addEventListener("click", () => {
      frame.classList.add("combat");
      hudStatus.className = "status-pill combat";
      hudStatus.textContent = "COMBAT MODE";
      playBeep(440, 0.2);
      setTimeout(() => playBeep(880, 0.25), 200);
      parler("Activation du mode combat.");
      sendCommand("COMBAT");
    });

    reposBtn.addEventListener("click", () => {
      frame.classList.remove("combat");
      hudStatus.className = "status-pill online";
      hudStatus.textContent = "CONNECTED";
      playBeep(600, 0.1);
      parler("Retour au mode repos.");
      sendCommand("REPOS");
    });

    connectBtn.addEventListener("click", initBLE);
  </script>
</body>
</html>
